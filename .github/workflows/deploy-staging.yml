name: Deploy to Staging (Cloudflare Pages)

on:
  pull_request:
    types: [labeled, synchronize]

env:
  PROJECT_NAME: gh200-tictactoe-app

jobs:
  build-and-stage:
    # 核心條件式：僅當 PR 帶有 'stage' 標籤時才觸發（GH-200 必考重點）
    if: contains(github.event.pull_request.labels.*.name, 'stage')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # 授權 Action 在 PR 留言回報預覽網址
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build Webpack
        run: |
          npm ci
          npm run build
          mkdir -p dist
          cp index.html dist/
          cp -r public dist/

      - name: Deploy Staging Preview to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. 若專案尚未建立，自動建立 Cloudflare Pages 專案（若已存在則忽略）
          npx --yes wrangler pages project create "$PROJECT_NAME" --production-branch=main || true
          # 2. 自動發布 Staging 暫存預覽環境（使用 $GITHUB_HEAD_REF 避免 Shell Injection）
          DEPLOY_OUTPUT=$(npx --yes wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch="$GITHUB_HEAD_REF" --commit-dirty=true 2>&1)
          echo "$DEPLOY_OUTPUT"
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -n 1)
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL on PR
        if: steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          BODY=$(printf "🚀 **Staging 預覽環境已部署完成！**\n\n預覽網址：%s" "$PREVIEW_URL")
          gh pr comment "$PR_NUMBER" --body "$BODY"